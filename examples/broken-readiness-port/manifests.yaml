# Scenario: the readiness probe targets port 8080, but nginx listens on 80.
# The Pod runs fine but never becomes Ready, so the Service gets no endpoints.
#
# Expected kdiag diagnosis:
#   root cause:  readiness-probe-port-mismatch
#   chain:       readiness-probe-port-mismatch → readiness-probe-failing
#                → pod-not-ready → service-no-ready-endpoints
apiVersion: v1
kind: Namespace
metadata:
  name: kdiag-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: kdiag-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8080 # BUG: nginx listens on 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: kdiag-demo
spec:
  selector:
    app: payment
  ports:
    - name: http
      port: 80
      targetPort: 80
