# Healthy control scenario. The e2e suite requires zero findings, complete
# evidence, and health=healthy after the Deployment becomes available.
apiVersion: v1
kind: Namespace
metadata:
  name: tuna-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-api
  namespace: tuna-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthy-api
  template:
    metadata:
      labels:
        app: healthy-api
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-api
  namespace: tuna-demo
spec:
  selector:
    app: healthy-api
  ports:
    - name: http
      port: 80
      targetPort: http
