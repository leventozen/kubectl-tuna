# Scenario anchor: Jobs are created dynamically by examples/e2e.sh so their
# ownerReference can use this CronJob's API-server-assigned UID. The CronJob is
# suspended to keep wall-clock schedule timing out of the deterministic test.
apiVersion: v1
kind: Namespace
metadata:
  name: tuna-demo
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: tuna-demo
spec:
  schedule: "0 * * * *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              command: ["/bin/true"]
