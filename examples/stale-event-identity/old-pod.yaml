# Scenario phase 1: a Pod with a failing readiness probe emits a real
# Unhealthy Event. Its UID is retained so the later same-name Pod cannot
# inherit that Event as evidence.
apiVersion: v1
kind: Namespace
metadata:
  name: tuna-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: stale-event
  namespace: tuna-demo
spec:
  containers:
    - name: app
      image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command: ["httpd", "-f", "-p", "8080"]
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: 9090 # closed; kubelet emits Unhealthy
        periodSeconds: 1
        failureThreshold: 1
