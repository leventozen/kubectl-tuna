# Scenario: the Deployment uses a claim whose StorageClass does not exist.
# The claim remains Pending and the scheduler reports an unbound immediate PVC.
#
# Expected Tuna diagnosis:
#   root cause:  persistent-volume-claim-pending
#   chain:       persistent-volume-claim-pending → pod-unschedulable
#                → pod-not-ready → deployment-unavailable
apiVersion: v1
kind: Namespace
metadata:
  name: tuna-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-api-data
  namespace: tuna-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: tuna-e2e-unavailable-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-api
  namespace: tuna-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-api
  template:
    metadata:
      labels:
        app: storage-api
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-api-data
