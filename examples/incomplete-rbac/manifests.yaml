# Healthy Service evaluated through an intentionally incomplete identity.
# The Role grants Tuna's namespaced read contract except EndpointSlices.
# Expected result: health=unknown, partial=true, zero findings, and one
# health-affecting endpointslices warning containing an RBAC denial.
apiVersion: v1
kind: Namespace
metadata:
  name: tuna-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuna-limited
  namespace: tuna-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuna-incomplete-reader
  namespace: tuna-demo
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # discovery.k8s.io/endpointslices is deliberately omitted.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuna-incomplete-reader
  namespace: tuna-demo
subjects:
  - kind: ServiceAccount
    name: tuna-limited
    namespace: tuna-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuna-incomplete-reader
---
# Node enrichment remains allowed so EndpointSlice authorization is the only
# collection gap exercised by this scenario.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuna-e2e-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuna-e2e-node-reader
subjects:
  - kind: ServiceAccount
    name: tuna-limited
    namespace: tuna-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuna-e2e-node-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-api
  namespace: tuna-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthy-api
  template:
    metadata:
      labels:
        app: healthy-api
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-api
  namespace: tuna-demo
spec:
  selector:
    app: healthy-api
  ports:
    - name: http
      port: 80
      targetPort: http
