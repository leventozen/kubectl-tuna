# Two Deployments intentionally share one Service selector. The serving Pod is
# Ready, but its Deployment remains unavailable because minReadySeconds has not
# elapsed. The other Pod has a broken readiness probe and is also unavailable.
#
# Expected Tuna contract:
#   - the Service remains healthy because it has a ready endpoint
#   - the broken Pod explains only broken-backend's unavailable finding
#   - serving-backend's unavailable finding remains standalone
#   - no service-no-ready-endpoints finding is emitted
apiVersion: v1
kind: Namespace
metadata:
  name: tuna-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-backend
  namespace: tuna-demo
spec:
  replicas: 1
  minReadySeconds: 3600
  progressDeadlineSeconds: 7200
  selector:
    matchLabels:
      app: shared-api
      workload: serving-backend
  template:
    metadata:
      labels:
        app: shared-api
        workload: serving-backend
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-backend
  namespace: tuna-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shared-api
      workload: broken-backend
  template:
    metadata:
      labels:
        app: shared-api
        workload: broken-backend
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8080 # BUG: nginx listens on 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: shared-api
  namespace: tuna-demo
spec:
  selector:
    app: shared-api
  ports:
    - name: http
      port: 80
      targetPort: http
