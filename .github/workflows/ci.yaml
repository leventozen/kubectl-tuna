name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./... -v

  e2e:
    name: End-to-end (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34.8"
            node_image: "kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256"
          - kubernetes: "1.35.5"
            node_image: "kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95"
          - kubernetes: "1.36.1"
            node_image: "kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kdiag-e2e
          version: v0.32.0
          node_image: ${{ matrix.node_image }}
      - name: Run e2e scenarios
        env:
          KDIAG_E2E_ARTIFACT_DIR: artifacts/e2e
          KDIAG_E2E_DISTRIBUTION: kind
          KDIAG_E2E_CLUSTER_NAME: kdiag-e2e
        run: ./examples/e2e.sh
      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kdiag-e2e-kubernetes-${{ matrix.kubernetes }}
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 30
