name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build ./...
      - name: Validate evaluator snapshot builder
        env:
          SNAPSHOT_ID: ci-${{ github.sha }}
        run: |
          bash ./scripts/build-evaluator-snapshot.sh "$SNAPSHOT_ID"
          artifact_dir="dist/evaluator-snapshot-${SNAPSHOT_ID}"
          test "$(find "$artifact_dir" -maxdepth 1 -type f | wc -l)" -eq 7
          test "$(wc -l < "${artifact_dir}/SHA256SUMS")" -eq 4
          "${artifact_dir}/kubectl-tuna-${SNAPSHOT_ID}-linux-amd64" --version
          for binary in "${artifact_dir}"/kubectl-tuna-*; do
            go version -m "$binary"
          done
          if bash ./scripts/build-evaluator-snapshot.sh "$SNAPSHOT_ID"; then
            echo "expected existing output to be rejected" >&2
            exit 1
          fi
          if bash ./scripts/build-evaluator-snapshot.sh ../unsafe; then
            echo "expected unsafe snapshot identity to be rejected" >&2
            exit 1
          fi
      - run: go test -race ./... -v

  e2e:
    name: End-to-end (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34.8"
            node_image: "kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256"
          - kubernetes: "1.35.5"
            node_image: "kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95"
          - kubernetes: "1.36.1"
            node_image: "kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: tuna-e2e
          version: v0.32.0
          node_image: ${{ matrix.node_image }}
      - name: Run e2e scenarios
        env:
          TUNA_E2E_ARTIFACT_DIR: artifacts/e2e
          TUNA_E2E_DISTRIBUTION: kind
          TUNA_E2E_CLUSTER_NAME: tuna-e2e
        run: ./examples/e2e.sh
      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tuna-e2e-kubernetes-${{ matrix.kubernetes }}
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 30
