apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: production
  uid: dep-uid-2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: app
          image: checkout:2.1
          ports:
            - containerPort: 8080
status:
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
  availableReplicas: 3
