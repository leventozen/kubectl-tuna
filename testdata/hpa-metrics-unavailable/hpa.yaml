apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: queue-worker
  namespace: autoscaling
  generation: 1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: queue-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
status:
  observedGeneration: 1
  currentReplicas: 2
  desiredReplicas: 2
  conditions:
    - type: AbleToScale
      status: "True"
      reason: SucceededGetScale
      message: the HPA controller was able to get the target's current scale
    - type: ScalingActive
      status: "False"
      reason: FailedGetResourceMetric
      message: the HPA was unable to compute the replica count because the resource metrics API was unavailable
    - type: ScalingLimited
      status: "False"
      reason: DesiredWithinRange
      message: the desired count is within the acceptable range
