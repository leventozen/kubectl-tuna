apiVersion: v1
kind: Pod
metadata:
  name: storage-api-rs-abcde
  namespace: storage
  uid: pod-storage-api
  labels:
    app: storage-api
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: storage-api-rs
      uid: replicaset-storage-api
      controller: true
spec:
  containers:
    - name: app
      image: example/storage-api:v1
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: storage-api-data
status:
  phase: Pending
  conditions:
    - type: PodScheduled
      status: "False"
      reason: Unschedulable
      message: "0/1 nodes are available: pod has unbound immediate PersistentVolumeClaims."
    - type: Ready
      status: "False"
      reason: ContainersNotReady
      message: "containers with unready status: [app]"
