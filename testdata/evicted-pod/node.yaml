apiVersion: v1
kind: Node
metadata:
  name: worker-1
status:
  conditions:
    - type: MemoryPressure
      status: "True"
      reason: KubeletHasInsufficientMemory
      message: kubelet has insufficient memory available
    - type: DiskPressure
      status: "False"
      reason: KubeletHasNoDiskPressure
      message: kubelet has no disk pressure
    - type: Ready
      status: "True"
      reason: KubeletReady
      message: kubelet is posting ready status
